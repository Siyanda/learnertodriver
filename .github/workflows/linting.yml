name: linting
on: [push]
jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .tool-versions
          bundler-cache: true
      - name: Install Gems
        run: bundle install
      - name: Run RuboCop
        uses: reviewdog/action-rubocop@v2
        with:
          rubocop_version: gemfile
          rubocop_extensions: |
            rubocop-rails:gemfile
            rubocop-capybara:gemfile
            rubocop-factory_bot:gemfile
          reporter: github-pr-review
  erb-lint:
    name: ERB Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .tool-versions
          bundler-cache: true
      - name: Install Gems
        run: bundle install
      - name: Run ERB Lint
        run: bundle exec erb_lint app/views
  brakeman:
    name: Brakeman
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .tool-versions
          bundler-cache: true
      - name: Install Gems
        run: bundle install
      - name: Run Brakeman
        run: bundle exec brakeman
